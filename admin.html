<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Moderation</title>
<style>
:root{--ink:#1c2a38;--paper:#f5f6f8;--brass:#a67c52;--line:#c9d0d8;--bad:#a33a3a;--sans:system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 var(--sans);color:var(--ink);background:var(--paper);padding:1.5rem;padding-top:calc(1.5rem + env(safe-area-inset-top,0px))}
main{max-width:64rem;margin:0 auto}
h1{font-size:1.6rem;margin-bottom:1rem}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
input,button{font:inherit}
input{padding:.6rem .8rem;border:1px solid var(--line);border-radius:4px;width:100%;max-width:20rem;display:block;margin-bottom:.7rem}
button{padding:.55rem 1rem;border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--ink)}
button.del{background:transparent;color:var(--bad);border-color:var(--bad)}
.bar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1.2rem}
.bar .sp{flex:1}
button[aria-pressed=true]{background:var(--brass);border-color:var(--brass)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:1rem}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.card img,.card video{width:100%;aspect-ratio:1;object-fit:cover;background:#e8ebef}
.acts{display:flex;gap:.5rem;padding:.6rem}
#msg{margin:1rem 0;min-height:1.5em}
#themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:1rem}
.tcard{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.tprev{padding:1.4rem 1rem;text-align:center}
.tname{font-size:2rem;line-height:1.1}
.sw{display:flex;gap:.4rem;justify-content:center;margin-top:.8rem}
.sw i{width:1.1rem;height:1.1rem;border-radius:50%;border:1px solid rgba(255,255,255,.4);display:block}
.tbody{padding:.8rem;display:flex;flex-direction:column;gap:.4rem;flex:1}
.tbody span{font-size:.9rem;color:#4a5560}
.tbody button{margin-top:auto}
button:disabled{opacity:.6;cursor:default}
[hidden]{display:none!important}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.NO_AUTO_THEME = true;</script>
<script src="themes.js"></script>
</head>
<body>
<main>
  <h1>Moderation</h1>
  <form id="login" hidden>
    <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <div id="app" hidden>
    <div class="bar">
      <button id="tPending" aria-pressed="true">Waiting for review</button>
      <button id="tApproved" class="alt" aria-pressed="false">Approved</button>
      <button id="tTheme" class="alt" aria-pressed="false">Theme</button>
      <span class="sp"></span>
      <button id="out" class="alt">Sign out</button>
    </div>
    <div id="grid"></div>
    <div id="themes" hidden></div>
  </div>
  <p id="msg" role="status"></p>
</main>
<script>
/* Same two values as in index.html */
const CONFIG = { supabaseUrl: "https://jufaoddkjyowobuhtobz.supabase.co", supabaseAnonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp1ZmFvZGRranlvd29idWh0b2J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDQ3NzksImV4cCI6MjEwNjIyMDc3OX0.mEzkjkrJU-qyCgQkOXnkhjtBp5QBarB0zxvofZmJ3Pc", bucket: "guest-uploads" };

const $ = id => document.getElementById(id);
const sb = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
let wid = null, showApproved = false;

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (session && !session.user.is_anonymous) return load();
  $("login").hidden = false; $("app").hidden = true;
}

async function load() {
  $("login").hidden = true;
  const { data, error } = await sb.from("wedding_admins").select("wedding_id").limit(1).maybeSingle();
  if (error || !data) {
    $("msg").textContent = "This account isn't an admin of any wedding. Run the last statement of setup-2-moderation.sql with your email.";
    $("app").hidden = true; return;
  }
  wid = data.wedding_id; $("app").hidden = false; $("msg").textContent = "";
  const { data: st } = await sb.from("wedding_settings").select("theme").eq("wedding_id", wid).maybeSingle();
  if (st && st.theme) currentTheme = st.theme;
  render();
}

async function render() {
  $("grid").innerHTML = ""; $("msg").textContent = "Loading...";
  const { data: rows, error } = await sb.from("media").select("*")
    .eq("wedding_id", wid).eq("approved", showApproved).order("created_at", { ascending: false });
  if (error) { $("msg").textContent = "Could not load: " + error.message; return; }
  if (!rows.length) { $("msg").textContent = showApproved ? "Nothing approved yet." : "Nothing waiting for review."; return; }
  const { data: urls } = await sb.storage.from(CONFIG.bucket).createSignedUrls(rows.map(r => r.path), 3600);
  const byPath = Object.fromEntries((urls || []).map(u => [u.path, u.signedUrl]));
  $("msg").textContent = rows.length + (rows.length === 1 ? " item" : " items");
  $("grid").innerHTML = rows.map(r => {
    const src = byPath[r.path] || "";
    const el = r.kind === "video"
      ? `<video src="${src}" controls preload="metadata" playsinline></video>`
      : `<img src="${src}" alt="Guest upload" loading="lazy">`;
    return `<div class="card">${el}<div class="acts">
      <button data-a="${showApproved ? "hide" : "approve"}" data-id="${r.id}">${showApproved ? "Hide" : "Approve"}</button>
      <button class="del" data-a="delete" data-id="${r.id}" data-path="${r.path}">Delete</button></div></div>`;
  }).join("");
}

$("grid").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  b.disabled = true;
  const { a, id, path } = b.dataset;
  let err;
  if (a === "approve" || a === "hide") {
    ({ error: err } = await sb.from("media").update({ approved: a === "approve" }).eq("id", id));
  } else if (a === "delete") {
    if (!confirm("Delete this permanently? This can't be undone.")) { b.disabled = false; return; }
    ({ error: err } = await sb.storage.from(CONFIG.bucket).remove([path]));
    if (!err) ({ error: err } = await sb.from("media").delete().eq("id", id));
  }
  if (err) { $("msg").textContent = "Failed: " + err.message; b.disabled = false; return; }
  render();
});

let currentTheme = "evening";

function setView(v) {
  showApproved = v === "approved";
  for (const [id, name] of [["tPending", "pending"], ["tApproved", "approved"], ["tTheme", "theme"]]) {
    $(id).setAttribute("aria-pressed", v === name);
    $(id).className = v === name ? "" : "alt";
  }
  $("grid").hidden = v === "theme"; $("themes").hidden = v !== "theme";
  if (v === "theme") renderThemes(); else render();
}
$("tPending").onclick = () => setView("pending");
$("tApproved").onclick = () => setView("approved");
$("tTheme").onclick = () => setView("theme");

/* Theme previews use each theme's own fonts, so load them all here */
(function () {
  const fam = [...new Set(Object.values(THEMES).flatMap(t => t.fonts.split("&")))];
  const l = document.createElement("link");
  l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?" + fam.join("&") + "&display=swap";
  document.head.append(l);
})();

function renderThemes() {
  $("msg").textContent = "";
  $("themes").innerHTML = Object.entries(THEMES).map(([id, t]) => {
    const v = t.vars, cur = id === currentTheme;
    return `<div class="tcard">
      <div class="tprev" style='background:${v["--ink"]};color:${v["--paper"]};font-family:${t.serif}'>
        <div class="tname">Alex &amp; Jordan</div>
        <div style='font-family:${t.sans};font-size:.85rem;opacity:.85'>Saturday, April 24, 2027</div>
        <div class="sw"><i style="background:${v["--brass-lt"]}"></i><i style="background:${v["--paper"]}"></i><i style="background:${v["--brass"]}"></i></div>
      </div>
      <div class="tbody"><b>${t.name}</b><span>${t.note}</span>
        <button data-theme="${id}" ${cur ? "disabled" : ""}>${cur ? "Current theme" : "Use this theme"}</button></div>
    </div>`;
  }).join("");
}

$("themes").addEventListener("click", async e => {
  const b = e.target.closest("button[data-theme]"); if (!b || b.disabled) return;
  b.disabled = true; $("msg").textContent = "Saving...";
  const id = b.dataset.theme;
  const { error } = await sb.from("wedding_settings").upsert({ wedding_id: wid, theme: id });
  if (error) { console.error(error); $("msg").textContent = "Couldn't save the theme: " + error.message; b.disabled = false; return; }
  currentTheme = id; renderThemes();
  $("msg").textContent = "Theme saved. Guests see it the next time they open or refresh the site.";
});

$("login").addEventListener("submit", async e => {
  e.preventDefault(); $("msg").textContent = "Signing in...";
  const { error } = await sb.auth.signInWithPassword({ email: $("em").value, password: $("pw").value });
  if (error) { $("msg").textContent = "Sign-in failed: " + error.message; return; }
  $("msg").textContent = ""; load();
});
$("out").onclick = async () => { await sb.auth.signOut(); location.reload(); };

if (CONFIG.supabaseUrl) boot(); else $("msg").textContent = "Add your Supabase URL and key to CONFIG in admin.html.";
</script>
</body>
</html>
